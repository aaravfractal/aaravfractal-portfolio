<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aarav Sharma</title>
<meta name="description" content="Aarav Sharma. I take Web3 products apart and build the fix.">
<meta property="og:title" content="Aarav Sharma">
<meta property="og:description" content="I take Web3 products apart and build the fix.">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0B0C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FF5B1F'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#0B0B0C;
    --ink-3:#1E1E21;
    --orange:#FF5B1F;
    --paper:#F6F2EA;
    --mute:#A29E97;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:18px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  main{
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:max(32px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));
    max-width:960px;
    margin:0 auto;
  }
  .line{
    width:72px;
    height:4px;
    background:var(--orange);
    border-radius:2px;
    margin:0 0 32px;
  }
  h1{
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-weight:500;
    font-size:clamp(48px,11vw,112px);
    line-height:1.02;
    letter-spacing:-0.02em;
    margin:0 0 20px;
  }
  p.intro{
    font-size:clamp(20px,3.4vw,28px);
    line-height:1.4;
    color:var(--paper);
    max-width:20em;
    margin:0 0 44px;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin:0 0 56px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    min-height:52px;
    padding:0 26px;
    border-radius:14px;
    font-size:18px;
    font-weight:600;
    text-decoration:none;
    border:2px solid var(--ink-3);
    color:var(--paper);
    transition:border-color .2s ease, background-color .2s ease;
  }
  .btn.primary{
    background:var(--orange);
    border-color:var(--orange);
    color:var(--ink);
  }
  .btn:hover{border-color:var(--orange)}
  .btn.primary:hover{background:#FF7A45;border-color:#FF7A45}
  .btn:focus-visible,.social a:focus-visible{
    outline:3px solid var(--paper);
    outline-offset:3px;
  }
  .social{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    font-size:17px;
  }
  .social a{
    color:var(--mute);
    text-decoration:none;
    min-height:44px;
    min-width:44px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:flex-start;
    border-bottom:2px solid transparent;
  }
  .social a:hover{color:var(--paper);border-bottom-color:var(--orange)}
  @media (prefers-reduced-motion: reduce){
    .btn{transition:none}
  }
</style>
</head>
<body>
<main>
  <div class="line" aria-hidden="true"></div>
  <h1>Aarav Sharma</h1>
  <p class="intro">I take Web3 products apart and build the fix.</p>
  <div class="actions">
    <a class="btn primary" href="/teardowns/">Ten teardowns</a>
    <a class="btn" href="mailto:aarav@aaravfractal.com">Say hello</a>
  </div>
  <nav class="social" aria-label="Profiles">
    <a href="https://www.linkedin.com/in/aarav7official" rel="noopener">LinkedIn</a>
  </nav>
</main>
</body>
</html>
